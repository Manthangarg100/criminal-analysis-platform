<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="fav-bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stopColor="#041209" />
      <stop offset="100%" stopColor="#000000" />
    </radialGradient>

    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#fav-bg)" rx="22" />

  <!-- Stencil C Emblem with Accent Bar and Dots -->
  <g filter="url(#fav-glow)" fill="#00ff87">
    <!-- Top Stencil Curve -->
    <path
      d="M 68 20 
         C 55 18 36 22 26 35 
         L 35 44 
         C 42 33 54 30 65 32 
         L 70 22 Z"
    />

    <!-- Left Segment -->
    <path
      d="M 18 46 
         C 17 52 17 56 18 62 
         L 29 60 
         C 28 56 28 52 29 48 Z"
    />

    <!-- Bottom Stencil Curve -->
    <path
      d="M 26 73 
         C 36 86 55 90 68 88 
         L 70 78 
         C 54 80 42 77 35 66 
         L 26 73 Z"
    />

    <!-- Accent Bar and Dots -->
    <rect x="18" y="91" width="34" height="4.5" rx="2.25" fill="#00ff87" />
    <circle cx="62" cy="93.25" r="3.25" fill="#00ff87" />
    <circle cx="74" cy="93.25" r="3.25" fill="#00ff87" />
  </g>
</svg>
