<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stopColor="#041209" />
      <stop offset="100%" stopColor="#000000" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Tactile Depth -->
    <filter id="tactile-shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" floodColor="#011b0e" floodOpacity="0.95" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <g transform="translate(45, 18)" filter="url(#neon-glow)">
    <!-- =================================================================
        1. STENCIL WORDMARK: C i P H E R
        ================================================================= -->
    <g filter="url(#tactile-shadow)" fill="#00ff87">
      <!-- --- LETTER C --- -->
      <path
        d="M 14 26
           C 18.5 19 28 16 38 16.5
           L 39 23
           C 31.5 22.5 24 25 20.5 30
           Z"
      />
      <path
        d="M 12 36
           C 11.5 41 11.5 46 12 51
           L 18.5 50.5
           C 18 46 18 41 18.5 36.5
           Z"
      />
      <path
        d="M 20.5 57
           C 24 62 31.5 64.5 39 64
           L 38 70.5
           C 28 71 18.5 68 14 61
           Z"
      />

      <!-- --- LETTER i --- -->
      <rect x="58" y="24" width="7" height="47" rx="2" />

      <!-- --- LETTER P --- -->
      <rect x="85" y="24" width="7" height="47" rx="2" />
      <path
        d="M 92 24
           L 112 24
           C 119 24 123 28.5 123 35
           C 123 41.5 119 46 112 46
           L 92 46
           L 92 39
           L 110 39
           C 113.5 39 116 37 116 35
           C 116 33 113.5 31 110 31
           L 92 31
           Z"
      />

      <!-- --- LETTER H --- -->
      <rect x="143" y="24" width="7" height="47" rx="2" />
      <rect x="171" y="24" width="7" height="47" rx="2" />
      <path
        d="M 150 44
           L 165 44
           L 165 51
           L 150 51
           Z"
      />
      <path
        d="M 144 47
           L 150 44
           L 150 51
           Z"
        fill="#059669"
      />

      <!-- --- LETTER E --- -->
      <rect x="193" y="24" width="29" height="7" rx="2" />
      <rect x="193" y="44" width="24" height="7" rx="2" />
      <rect x="193" y="64" width="29" height="7" rx="2" />

      <!-- --- LETTER R --- -->
      <path
        d="M 241 24
           L 266 24
           C 273 24 277 28.5 277 35
           C 277 41.5 273 46 266 46
           L 246 46
           L 246 39
           L 264 39
           C 267.5 39 270 37 270 35
           C 270 33 267.5 31 264 31
           L 241 31
           Z"
      />
      <path
        d="M 252 44
           L 259 44
           L 273 65
           L 278 65
           L 278 71
           L 268 71
           Z"
      />
    </g>

    <!-- =================================================================
        2. ACCENT BAR & TWO DOTS
        ================================================================= -->
    <g fill="#00ff87">
      <rect x="14" y="92" width="68" height="5.5" rx="2.75" />
      <circle cx="97" cy="94.75" r="4.25" />
      <circle cx="115" cy="94.75" r="4.25" />
    </g>

    <!-- =================================================================
        3. STACKED TAGLINE: SMARTER / INVESTIGATIONS
        ================================================================= -->
    <g fill="#00ff87">
      <text
        x="142"
        y="93"
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="0.28em"
        fill="#00ff87"
      >
        SMARTER
      </text>
      <text
        x="142"
        y="110"
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="0.28em"
        fill="#00ff87"
      >
        INVESTIGATIONS
      </text>
    </g>
  </g>
</svg>
