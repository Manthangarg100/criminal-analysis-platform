<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <!-- Neon green glow filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#000000" />

  <!-- EMBLEM ICON (Left) -->
  <g transform="translate(10, 10)" filter="url(#neon-glow)">
    <!-- Outer 3D Hexagonal Prism C - Front Face -->
    <path
      d="M 60 12 
         L 100 35 
         L 95 44 
         L 65 27 
         L 28 48 
         L 28 72 
         L 65 93 
         L 95 76 
         L 100 85 
         L 60 108 
         L 18 84 
         L 18 36 Z"
      fill="none"
      stroke="#00ff87"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Inner Isometric Depth Lines (Isometric Wireframe Facets) -->
    <path
      d="M 60 12 L 50 24 L 28 37 M 100 35 L 88 44 M 60 108 L 50 96 L 28 83 M 100 85 L 88 76"
      fill="none"
      stroke="#10b981"
      stroke-width="2"
      stroke-opacity="0.8"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    
    <!-- Secondary Inner Ridge to complete the 3D Prism -->
    <path
      d="M 75 42 L 40 58 L 40 68 L 75 80"
      fill="none"
      stroke="#00ff87"
      stroke-width="2.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Central 4-Point Radiant Sparkle Star -->
    <path
      d="M 60 44 Q 60 60 76 60 Q 60 60 60 76 Q 60 60 44 60 Q 60 60 60 44 Z"
      fill="#00ff87"
      filter="url(#star-glow)"
    />
    <!-- Sparkle core highlight -->
    <circle cx="60" cy="60" r="2" fill="#ffffff" />
  </g>

  <!-- WORDMARK: CLUVENTA (White Geometric Sans with Chevron A) -->
  <g fill="#ffffff" transform="translate(148, 40)">
    <!-- C -->
    <path d="M 28 12 C 16 12 6 22 6 34 C 6 46 16 56 28 56 C 35 56 41 53 45 47 L 39 42 C 36 46 32 48 28 48 C 20 48 14 42 14 34 C 14 26 20 20 28 20 C 32 20 36 22 39 26 L 45 21 C 41 15 35 12 28 12 Z" />
    
    <!-- L -->
    <path d="M 60 14 L 68 14 L 68 48 L 94 48 L 94 55 L 60 55 Z" />
    
    <!-- U -->
    <path d="M 110 14 L 118 14 L 118 41 C 118 46 122 50 128 50 C 134 50 138 46 138 41 L 138 14 L 146 14 L 146 41 C 146 51 138 56 128 56 C 118 56 110 51 110 41 Z" />
    
    <!-- V -->
    <path d="M 162 14 L 171 14 L 182 45 L 193 14 L 202 14 L 187 55 L 177 55 Z" />
    
    <!-- E -->
    <path d="M 218 14 L 250 14 L 250 21 L 226 21 L 226 31 L 246 31 L 246 38 L 226 38 L 226 48 L 250 48 L 250 55 L 218 55 Z" />
    
    <!-- N -->
    <path d="M 268 14 L 276 14 L 298 44 L 298 14 L 306 14 L 306 55 L 298 55 L 276 25 L 276 55 L 268 55 Z" />
    
    <!-- T -->
    <path d="M 318 14 L 354 14 L 354 21 L 340 21 L 340 55 L 332 55 L 332 21 L 318 21 Z" />
    
    <!-- Stylized Chevron A (Λ without crossbar) -->
    <path d="M 382 14 L 391 14 L 409 55 L 400 55 L 386.5 24 L 373 55 L 364 55 Z" />
  </g>

  <!-- SUBTITLE: INSIGHTS • CONNECTIONS • ACTION (Neon Green Tracking) -->
  <g fill="#00ff87" filter="url(#star-glow)">
    <text
      x="152"
      y="118"
      font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
      font-size="11.5"
      font-weight="700"
      letter-spacing="0.32em"
      fill="#00ff87"
    >
      INSIGHTS  •  CONNECTIONS  •  ACTION
    </text>
  </g>
</svg>
